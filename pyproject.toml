[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-memory"
version = "0.1.0"
description = "Declared, AI-optional project memory for agents: an append-only episode log + crystallized facts, hybrid recall, natural-language asks, and a MUD epistemic guard that refuses to synthesize contradictory facts. Local-first, $0."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eyal Nof" }]
keywords = [
    "memory", "agent-memory", "episodic-memory", "facts", "recall",
    "bm25", "fts5", "sqlite", "hybrid-search", "intent", "synthesis",
    "epistemic", "local-first", "declared",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Indexing",
]
# One honest dependency:
#   declared-core — the retrieval engine (BM25 + structural + RRF + intent).
# It is local, offline, $0. Dense (semantic) recall stays OPTIONAL below.
dependencies = [
    "declared-core>=0.1",
]

[project.optional-dependencies]
# Dense (paraphrase) recall is an OPTIONAL booster. Without it, recall runs
# pure-lexical + structural and is byte-for-byte deterministic. numpy powers the
# brute-force cosine index (via declared-core[dense]).
dense = ["declared-core[dense]>=0.1", "numpy>=1.21"]
# Everything needed to run the test suite.
dev = ["pytest>=7.0", "numpy>=1.21"]

[project.urls]
Homepage = "https://github.com/verbalogicproject-creator/NLKE-project-memory"
Documentation = "https://github.com/verbalogicproject-creator/NLKE-project-memory/tree/main/docs"
Changelog = "https://github.com/verbalogicproject-creator/NLKE-project-memory/blob/main/CHANGELOG.md"

[project.scripts]
project-memory = "project_memory.cli:main"

[tool.setuptools.packages.find]
include = ["project_memory*"]

[tool.setuptools.package-data]
project_memory = ["demo_corpus/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
